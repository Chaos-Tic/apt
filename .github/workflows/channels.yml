name: Channels
# Compares every project's latest release with the versions served by the
# apt repository, the Launchpad PPAs, Fedora COPR, the AUR and winget
# (channels.json, channels.py). On a lag or a broken channel the run fails
# and the issue "Distribution channels lag behind" is opened or refreshed;
# it is closed once everything is aligned again. Runs twice a week, by hand,
# and a day after a project's release dispatch (channels need time to build).
on:
  schedule:
    - cron: '41 6 * * 1,4'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: channels
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: audit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          python3 channels.py channels.json --summary "$GITHUB_STEP_SUMMARY" >report.md
          echo "status=$?" >>"$GITHUB_OUTPUT"
      - env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ steps.audit.outputs.status }}
          TITLE: Distribution channels lag behind
        run: |
          number=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
            --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n1)
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          {
            echo "Audit of $(date -u +%Y-%m-%d) ([run]($run_url)). Rows marked LAG or ERROR need a fix: look at the project's release job or the channel's own dashboard, or mark the channel frozen on purpose in \`channels.json\`."
            echo
            cat report.md
          } >body.md
          if [ "$STATUS" = 0 ]; then
            if [ -n "$number" ]; then
              gh issue comment "$number" --body-file body.md
              gh issue close "$number" --comment "All channels serve the latest releases again."
            fi
            exit 0
          fi
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file body.md
            gh issue comment "$number" --body "Still lagging on $(date -u +%Y-%m-%d): see the updated description ([run]($run_url))."
          else
            gh issue create --title "$TITLE" --body-file body.md
          fi
          exit 1
